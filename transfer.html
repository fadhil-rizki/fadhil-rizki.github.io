<!DOCTYPE html>
<html>
<head>
    <title>Transfer - NeoBank</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Transfer Uang</h2>

    <select>
        <option>Bank Central Asia</option>
        <option>Bank Negara Indonesia</option>
        <option>Bank Syariah Indonesia</option>
    </select>

    <input placeholder="Nomor Rekening">
    <input placeholder="Jumlah Transfer">

    <button>Kirim</button>
</div>

</body>
</html>
