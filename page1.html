<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  max-width: 400px;
  animation: fade 1.2s ease;
}
@keyframes fade {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
button {
  margin-top: 20px;
  padding: 10px 22px;
  border: none;
  border-radius: 20px;
  background: #ff7aa2;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h2>🎉 Selamat Ulang Tahun</h2>
  <h3>Tafida Hanin Aulia</h3>
  <p>
    Cihuyy ada yang seneng nihh hari ini,  
    Selamat ulang tahun ya hanin,  
    Aku ada pesan buat kamu, spesial banget pokoknya
  </p>
  <button onclick="location.href='page2.html'">Lanjut ➜</button>
</div>

</body>
</html>
