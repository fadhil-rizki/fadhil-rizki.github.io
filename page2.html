<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>For You 🎀</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffe0f0, #ffc3d9);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 25px;
  text-align: center;
  max-width: 420px;
  animation: zoom 1s ease;
}
@keyframes zoom {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
img {
  width: 200px;
  border-radius: 20px;
  margin-bottom: 15px;
}
p {
  min-height: 60px;
}
button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #ff7aa2;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
  <img src="hanin.jpg" alt="Hanin">
  <p id="text">Klik tombolnya ✨</p>
  <button onclick="randomText()">Klik lagi 🎀</button>
</div>

<script>
const texts = [
  "Semoga panjang umur",
  "Semoga sehat selalu",
  "Semoga diberi kelancaran dalam urusan apapun",
  "Semoga cita-citamu tercapai",
  "Semoga semua yang kamu impikan tercapai",
  "Semoga tahun ini lebih baik dari sebelumnya 🎉"
];

function randomText() {
  const i = Math.floor(Math.random() * texts.length);
  document.getElementById("text").innerText = texts[i];
}
</script>

</body>
</html>
