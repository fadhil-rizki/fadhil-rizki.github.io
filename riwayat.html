<!DOCTYPE html>
<html>
<head>
    <title>Riwayat Transaksi - NeoBank</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th {
            background: #1e293b;
        }

        .keluar {
            color: #f87171;
        }

        .masuk {
            color: #4ade80;
        }
    </style>
</head>
<body>

<h2>Riwayat Transaksi</h2>

<table>
    <tr>
        <th>Tanggal</th>
        <th>Keterangan</th>
        <th>Jumlah</th>
    </tr>

    <tr>
        <td>21 Februari 2026</td>
        <td>Transfer ke BCA</td>
        <td class="keluar">- Rp 500.000</td>
    </tr>

    <tr>
        <td>25 Februari 2026</td>
        <td>Gaji Masuk</td>
        <td class="masuk">+ Rp 5.000.000</td>
    </tr>
</table>

</body>
</html>
