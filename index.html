<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hi 🙂</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 32px;
      width: 420px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      margin-bottom: 10px;
      font-size: 22px;
      color: #333;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      min-height: 90px;
      color: #555;
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    button {
      margin-top: 18px;
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      background: #f8b500;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      background: #e6a700;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hai 🙂</h1>
    <p id="message">Klik tombol di bawah ya.</p>
    <button onclick="nextMessage()">klik lagi</button>
    <div class="footer">dibuat santai, tanpa maksud aneh-aneh</div>
  </div>

  <script>
    const messages = [
      "Kadang ngobrol sebentar aja bisa bikin hari lebih ringan.",
      "Tenang aja, ini cuma pesan kecil dari teman.",
      "Kalau hari kamu berat, semoga ini bikin agak mendingan.",
      "Aku nulis ini iseng, tapi harapannya tulus.",
      "Nggak semua hal harus dibales, cukup dibaca aja juga gapapa.",
      "Semoga hari kamu hari ini nggak terlalu capek.",
      "Kadang perhatian kecil lebih nyaman dari obrolan panjang.",
      "Aku di sini cuma sebagai teman yang peduli."
    ];

    function nextMessage() {
      const el = document.getElementById("message");
      el.style.opacity = 0;
      el.style.transform = "scale(0.95)";

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * messages.length);
        el.innerText = messages[randomIndex];
        el.style.opacity = 1;
        el.style.transform = "scale(1)";
      }, 200);
    }
  </script>

</body>
</html>
