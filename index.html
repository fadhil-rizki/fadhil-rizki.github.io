<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mini Kasir Bioskop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    select, input, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      margin-top: 15px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    .box {
      margin-top: 25px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h1>🎬 Mini Kasir Bioskop</h1>

<div class="container">

  <label>Pilih Film</label>
  <select id="film">
    <option value="">-- pilih film --</option>
    <option value="35000|AGAK LAEN: MENYALA PANTIKU">AGAK LAEN: MENYALA PANTIKU</option>
    <option value="40000|MODUAL NEKAD">MODUAL NEKAD</option>
    <option value="40000|JANUR IRENG SEWU DINO">JANUR IRENG SEWU DINO</option>
    <option value="40000|AVATAR: FIRE AND ASH">AVATAR: FIRE AND ASH</option>
    <option value="40000|THE SPONGEBOB MOVIE">THE SPONGEBOB MOVIE</option>
    <option value="35000|TIMUR">TIMUR</option>
  </select>

  <label>Jumlah Tiket</label>
  <input type="number" id="jumlahTiket">

  <label>Nomor Kursi</label>
  <input type="text" id="kursi" placeholder="contoh A1, B2">

  <label>Jumlah Popcorn (Rp 10.000)</label>
  <input type="number" id="popcorn" value="0">

  <label>Jumlah Minuman (Rp 8.000)</label>
  <input type="number" id="minuman" value="0">

  <button onclick="tambahPesanan()">Tambah Pesanan</button>

  <div class="box">
    <h3>📋 Daftar Pesanan</h3>
    <pre id="daftar">Belum ada pesanan.</pre>
  </div>

  <div class="box">
    <h3>💰 Total Pembayaran</h3>
    <pre id="total">Rp 0</pre>
  </div>

</div>

<script>
  const pesanan = [];

  function tambahPesanan() {
    const filmData = document.getElementById("film").value;
    const jumlahTiket = parseInt(document.getElementById("jumlahTiket").value);
    const kursi = document.getElementById("kursi").value;
    const popcorn = parseInt(document.getElementById("popcorn").value) || 0;
    const minuman = parseInt(document.getElementById("minuman").value) || 0;

    if (!filmData || !jumlahTiket || !kursi) {
      alert("Lengkapi data terlebih dahulu.");
      return;
    }

    const [hargaFilm, namaFilm] = filmData.split("|");

    const data = {
      film: namaFilm,
      harga: parseInt(hargaFilm),
      tiket: jumlahTiket,
      kursi: kursi,
      popcorn: popcorn,
      minuman: minuman
    };

    pesanan.push(data);
    tampilkanPesanan();
  }

  function tampilkanPesanan() {
    let output = "";
    let totalBayar = 0;

    pesanan.forEach((p, i) => {
      const totalFilm = p.harga * p.tiket;
      const totalSnack = (p.popcorn * 10000) + (p.minuman * 8000);
      const subtotal = totalFilm + totalSnack;
      totalBayar += subtotal;

      output += `${i+1}. ${p.film}\n`;
      output += `   Tiket : ${p.tiket}\n`;
      output += `   Kursi : ${p.kursi}\n`;
      if (p.popcorn > 0) output += `   Popcorn : ${p.popcorn} pcs\n`;
      if (p.minuman > 0) output += `   Minuman : ${p.minuman} pcs\n`;
      output += `   Subtotal : Rp ${subtotal.toLocaleString()}\n\n`;
    });

    document.getElementById("daftar").innerText = output || "Belum ada pesanan.";
    document.getElementById("total").innerText = "Rp " + totalBayar.toLocaleString();
  }
</script>

</body>
</html>
