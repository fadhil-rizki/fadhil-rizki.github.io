<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hai Hanin</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 360px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h2 {
      margin: 8px 0;
      font-size: 20px;
    }

    p {
      min-height: 90px;
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      transition: opacity 0.3s ease;
    }

    button {
      margin-top: 18px;
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      background: #ff7aa2;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #ff5f90;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="card">
  <img class="photo" src="hanin.jpg.jpeg" alt="Hanin">
  <h2>Hai Hanin 🙂</h2>

  <p id="text">Klik tombol di bawah ya.</p>

  <button onclick="randomText()">klik lagi</button>

  <div class="footer">
    dibuat santai, nggak ada maksud apa-apa
  </div>
</div>

<script>
  const texts = [
    "Kadang hari biasa bisa terasa lebih ringan cuma karena satu hal kecil.",
    "Ini nggak penting, cuma pengen bilang semoga harimu baik-baik aja.",
    "Kalau capek, nggak apa-apa istirahat sebentar.",
    "Aku nulis ini random aja, tanpa maksud aneh-aneh.",
    "Semoga hari ini nggak terlalu melelahkan.",
    "Kalau senyum hari ini, semoga tulus.",
    "Ini pesan kecil, nggak perlu dibales juga nggak apa-apa.",
    "Kadang hal sederhana justru paling cukup."
  ];

  function randomText() {
    const el = document.getElementById("text");
    el.style.opacity = 0;
    setTimeout(() => {
      const i = Math.floor(Math.random() * texts.length);
      el.innerText = texts[i];
      el.style.opacity = 1;
    }, 200);
  }
</script>

</body>
</html>
