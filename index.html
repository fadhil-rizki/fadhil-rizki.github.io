<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hi Hanin 🌸</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Baloo 2', cursive;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Animasi background hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: float 8s linear infinite;
      opacity: 0.6;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
      }
      100% {
        transform: translateY(-120vh) rotate(45deg);
      }
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      width: 340px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      animation: pop 0.6s ease;
      z-index: 2;
    }

    @keyframes pop {
      from {
        transform: scale(0.85);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ff9fc9;
      margin-bottom: 12px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      margin: 5px 0;
      color: #ff5f9e;
    }

    p {
      min-height: 70px;
      font-size: 15px;
      color: #444;
      transition: opacity 0.3s ease;
    }

    button {
      margin-top: 15px;
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      background: #ff7eb3;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #ff4f95;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- floating hearts -->
  <div class="flower" style="left:10%; animation-delay:0s;"></div>
  <div class="flower" style="left:30%; animation-delay:2s;"></div>
  <div class="flower" style="left:50%; animation-delay:4s;"></div>
  <div class="flower" style="left:70%; animation-delay:1s;"></div>
  <div class="flower" style="left:90%; animation-delay:3s;"></div>

  <div class="card">
    <!-- FOTO -->
    <img src="hanin.jpg" alt="Hanin" class="photo">

    <h1>Hai Hanin 🌸</h1>

    <p id="text">Klik tombol di bawah ya.</p>

    <button onclick="randomText()">klik lagi</button>

    <div class="footer">
      dibuat iseng✨
    </div>
  </div>

  <script>
    const texts = [
      "Kadang hal kecil bisa bikin hari jadi lebih ringan 🌸",
      "Ini random aja, tapi semoga kamu senyum dikit ya 💗",
      "Kalau capek, jangan lupa istirahat 💤",
      "Hari ini semoga nggak berat-berat amat ✨",
      "Nggak ada maksud apa-apa, cuma pengen nyapa 🙂",
      "Semoga harimu sewarna background ini 🌷",
      "Kalau senyum, semoga tulus ya ",
      "Pesan kecil yang nggak wajib dibales 🌸"
    ];

    function randomText() {
      const el = document.getElementById("text");
      el.style.opacity = 0;
      setTimeout(() => {
        el.innerText = texts[Math.floor(Math.random() * texts.length)];
        el.style.opacity = 1;
      }, 200);
    }
  </script>

</body>
</html>
