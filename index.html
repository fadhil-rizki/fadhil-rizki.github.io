<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Just a Simple Page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      width: 320px;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 4px solid #ffb6c1;
    }

    h2 {
      margin: 10px 0 5px;
      font-size: 20px;
    }

    p {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- FOTO PLACEHOLDER -->
    <img 
      src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e"
      alt="Foto Cewek"
      class="photo"
    >

    <h2>Someone Special</h2>
    <p>
      Ini cuma halaman sederhana.  
      Dibikin pelan-pelan, nggak ada maksud aneh.  
      Cuma pengen bikin sesuatu yang rapi dan tenang.
    </p>

    <div class="footer">
      dibuat iseng tapi niat
    </div>
  </div>

</body>
</html>
