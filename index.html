<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semangat Skripsi</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .paper {
      width: 350px;
      min-height: 220px;
      background: #fffdf7;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      position: relative;
      transform: rotate(-2deg);
      animation: float 3s ease-in-out infinite;
    }

    .paper::before {
      content: "";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 25px;
      background: #f87171;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #333;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #444;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      width: 100%;
    }

    button:hover {
      background: #5a67d8;
    }

    @keyframes float {
      0%,100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(-2deg) translateY(-10px); }
    }

  </style>
</head>
<body>

  <div class="paper">
    <h2>Semangat Skripsi 💪</h2>
    <p id="quote">
      Kamu sudah sampai sejauh ini. Jangan berhenti sekarang. Skripsi ini bukan akhir, tapi awal menuju masa depan yang lebih baik.
    </p>
    <button onclick="gantiKata()">Klik untuk motivasi lagi</button>
  </div>

  <script>
    const kataSemangat = [
      "Pelan tidak apa-apa, yang penting terus maju. Skripsimu akan selesai tepat waktu.",
      "Setiap halaman yang kamu kerjakan hari ini mendekatkanmu ke wisuda.",
      "Jangan menyerah. Kamu lebih kuat dari rasa malasmu.",
      "Capek itu wajar, berhenti itu pilihan. Kamu pasti bisa.",
      "Bayangkan orang tuamu bangga saat kamu lulus nanti.",
      "Satu paragraf hari ini lebih baik daripada tidak sama sekali.",
      "Percaya pada proses. Semua perjuanganmu akan terbayar.",
      "Kamu tidak sendirian. Banyak orang juga sedang berjuang seperti kamu.",
      "Fokus sekarang, bahagia nanti.",
      "Skripsi ini hanya sementara, gelar itu selamanya."
    ];

    function gantiKata() {
      const random = Math.floor(Math.random() * kataSemangat.length);
      document.getElementById("quote").innerText = kataSemangat[random];
    }
  </script>

</body>
</html>
