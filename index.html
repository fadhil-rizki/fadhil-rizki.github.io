<!DOCTYPE html>
<html>
<head>
    <title>NeoBank</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            background: rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .menu a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        /* HERO */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px 40px;
        }

        .hero-text h1 {
            font-size: 50px;
        }

        .hero-text p {
            color: #cbd5e1;
            margin: 20px 0;
        }

        .btn {
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
        }

        /* CARD */
        .cards {
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            flex: 1;
        }

        .card h3 {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">NeoBank</div>
    <div class="menu">
        <a href="#">Produk</a>
        <a href="#">Promo</a>
        <a href="login.html">Login</a>
    </div>
</div>

<div class="hero">
    <div class="hero-text">
        <h1>Bank Digital Masa Depan</h1>
        <p>Transfer, investasi, dan pembayaran dalam satu aplikasi.</p>
        <a href="#" class="btn">Buka Rekening</a>
    </div>
</div>

<div class="cards">
    <div class="card">
        <h3>Gratis Transfer</h3>
        <p>Transfer antar bank tanpa biaya.</p>
    </div>

    <div class="card">
        <h3>Keamanan Tinggi</h3>
        <p>Proteksi AI dan enkripsi modern.</p>
    </div>

    <div class="card">
        <h3>Investasi Mudah</h3>
        <p>Mulai investasi hanya dari 10 ribu.</p>
    </div>
</div>

</body>
</html>
