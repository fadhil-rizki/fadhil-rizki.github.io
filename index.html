<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mini Kasir Bioskop</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1b2735, #090a0f);
  color:#fff;
  margin:0;
  padding:20px;
}
h1{text-align:center;color:#f5c542;}
.container{
  max-width:900px;
  margin:auto;
  background:#111;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 25px rgba(255,197,66,0.2);
}
label{display:block;margin-top:10px;}
input,select,button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:none;
}
button{
  background:#f5c542;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}
button:hover{background:#ffdb6e;}
.box{
  margin-top:20px;
  padding:15px;
  background:#1c1c1c;
  border-radius:8px;
}
pre{white-space:pre-wrap;}
hr{border:1px solid #333;}
</style>
</head>

<body>

<h1>🎬 MINI KASIR BIOSKOP</h1>

<div class="container">

<label>Film</label>
<select id="film">
  <option value="">-- pilih film --</option>
  <option value="40000|AGAK LAEN">AGAK LAEN: MENYALA PANTIKU</option>
  <option value="40000|MODAL NEKAD">MODUAL NEKAD</option>
  <option value="40000|JANUR IRENG">JANUR IRENG SEWU DINO THE PREQUEL</option>
  <option value="40000|AVATAR">AVATAR: FIRE AND ASH</option>
  <option value="40000|AVATAR">THE SPONGEBOB MOVIE: SEARCH FOR SQUAREPANTS</option>
  <option value="40000|AVATAR">TIMUR</option>
</select>

<label>Jumlah Tiket</label>
<input type="number" id="tiket">

<label>Kursi</label>
<input type="text" id="kursi" placeholder="A1, B3">

<label>Popcorn (Rp 10.000)</label>
<input type="number" id="popcorn" value="0">

<label>Minuman (Rp 8.000)</label>
<input type="number" id="minuman" value="0">

<button onclick="tambah()">Tambah Pesanan</button>

<div class="box">
<h3>🧾 Daftar Pesanan</h3>
<pre id="daftar">Belum ada pesanan.</pre>
</div>

<div class="box">
<h3>💰 Total & Pembayaran</h3>
<label>Uang Dibayar</label>
<input type="number" id="bayar">
<button onclick="hitungBayar()">Hitung</button>
<pre id="hasilBayar"></pre>
</div>

<div class="box">
<h3>📊 Laporan</h3>
<pre id="laporan">-</pre>
</div>

</div>

<script>
const pesanan=[];

function tambah(){
  const filmData=document.getElementById("film").value;
  const tiket=parseInt(document.getElementById("tiket").value);
  const kursi=document.getElementById("kursi").value;
  const popcorn=parseInt(document.getElementById("popcorn").value)||0;
  const minuman=parseInt(document.getElementById("minuman").value)||0;

  if(!filmData||!tiket||!kursi){
    alert("Lengkapi data!");
    return;
  }

  const [harga,nama]=filmData.split("|");

  pesanan.push({
    nama:nama,
    harga:parseInt(harga),
    tiket:tiket,
    kursi:kursi,
    popcorn:popcorn,
    minuman:minuman
  });

  tampilkan();
}

function tampilkan(){
  let out="",total=0,tTiket=0,tPop=0,tMin=0;

  pesanan.forEach((p,i)=>{
    const filmTotal=p.harga*p.tiket;
    const snackTotal=(p.popcorn*10000)+(p.minuman*8000);
    const sub=filmTotal+snackTotal;
    total+=sub;
    tTiket+=p.tiket;
    tPop+=p.popcorn;
    tMin+=p.minuman;

    out+=`${i+1}. ${p.nama}\n`;
    out+=`   Tiket : ${p.tiket}\n`;
    out+=`   Kursi : ${p.kursi}\n`;
    out+=`   Popcorn : ${p.popcorn}\n`;
    out+=`   Minuman : ${p.minuman}\n`;
    out+=`   Subtotal : Rp ${sub.toLocaleString()}\n\n`;
  });

  document.getElementById("daftar").innerText=out||"Belum ada pesanan.";
  document.getElementById("laporan").innerText=
    `Total Tiket : ${tTiket}\nPopcorn : ${tPop}\nMinuman : ${tMin}\nTotal Penjualan : Rp ${total.toLocaleString()}`;
}

function hitungBayar(){
  let total=0;
  pesanan.forEach(p=>{
    total+=(p.harga*p.tiket)+(p.popcorn*10000)+(p.minuman*8000);
  });

  const bayar=parseInt(document.getElementById("bayar").value);
  if(!bayar){alert("Masukkan uang");return;}

  const kembali=bayar-total;
  document.getElementById("hasilBayar").innerText=
    `Total : Rp ${total.toLocaleString()}\nBayar : Rp ${bayar.toLocaleString()}\nKembalian : Rp ${kembali.toLocaleString()}`;
}
</script>

</body>
</html>
