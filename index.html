<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selamat Ulang Tahun, Tafida Hanin Aulia 🎉</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="hero">
    <div class="card">
      <div class="left">
        <img id="photo" src="assets/photo.jpg" alt="Foto Tafida (ganti di assets/photo.jpg)">
      </div>
      <div class="right">
        <h1>Selamat Ulang Tahun</h1>
        <h2 class="name">Tafida Hanin Aulia</h2>
        <p class="subtitle">Semoga hari ini dipenuhi tawa, cinta, dan kejutan manis </p>

        <div class="buttons">
          <button id="openGiftBtn" class="btn primary">Buka Hadiah 🎁</button>
          <button id="playMusicBtn" class="btn">Putar Musik ♪</button>
        </div>

        <div class="countdown" id="countdown" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <!-- Modal hadiah / ucapan -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close" id="closeModal">&times;</button>
      <h3>Untuk Tafida</h3>
      <p id="message">
        Hai Tafida — semoga segala impianmu tercapai. Terima kasih sudah hadir dan membuat dunia lebih indah. Selamat ulang tahun!
      </p>
      <div class="gift-photo">
        <img src="assets/photo.jpg" alt="Foto Tafida">
      </div>
    </div>
  </div>

  <!-- Audio (ganti src dengan file musik Anda atau URL) -->
  <audio id="bgMusic" src="" preload="none"></audio>

  <script src="script.js" defer></script>
</body>
</html>
