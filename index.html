<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hi 🙂</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px;
      width: 420px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .photo:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      min-height: 90px;
      font-size: 16px;
      line-height: 1.6;
      color: #555;
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    button {
      margin-top: 18px;
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      background: #f8b500;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    button:hover {
      background: #e6a700;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- FOTO CEWEK DI SINI -->
  <img src="foto-cewek.jpg" alt="foto" class="photo">

  <h1>Hai 🙂</h1>

  <p id="message">Klik tombol di bawah ya.</p>

  <button onclick="nextMessage()">klik lagi</button>

  <div class="footer">dibuat santai, sebagai teman</div>
</div>

<script>
  const messages = [
    "Kadang hal kecil bisa bikin hari jadi lebih ringan.",
    "Ini cuma pesan sederhana dari teman.",
    "Kalau capek, semoga ini bikin sedikit tenang.",
    "Nggak perlu dibales, cukup dibaca aja.",
    "Kadang perhatian kecil lebih nyaman.",
    "Aku nulis ini tanpa maksud aneh-aneh.",
    "Semoga hari kamu nggak terlalu berat.",
    "Ini cuma pengingat kecil kalau kamu nggak sendirian."
  ];

  function nextMessage() {
    const el = document.getElementById("message");
    el.style.opacity = 0;
    el.style.transform = "scale(0.95)";

    setTimeout(() => {
      const i = Math.floor(Math.random() * messages.length);
      el.innerText = messages[i];
      el.style.opacity = 1;
      el.style.transform = "scale(1)";
    }, 200);
  }
</script>

</body>
</html>
