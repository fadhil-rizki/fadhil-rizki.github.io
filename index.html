<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hi Hanin</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  font-family:'Comic Neue', cursive;
  background: linear-gradient(135deg,#ffe0f0,#fff3f8);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Sparkle */
.sparkle{
  position:absolute;
  width:10px;
  height:10px;
  background:#ff9fc9;
  border-radius:50%;
  animation: sparkle 6s linear infinite;
  opacity:0.7;
}
@keyframes sparkle{
  0%{transform:translateY(100vh) scale(0);}
  100%{transform:translateY(-120vh) scale(1);}
}

/* Card */
.card{
  background:white;
  padding:25px;
  width:340px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
  z-index:2;
}

/* Foto */
.photo{
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #ff9fc9;
  margin-bottom:10px;
}

/* Kitty icon */
.kitty{
  font-size:40px;
  animation: wiggle 1.8s infinite;
}
@keyframes wiggle{
  0%,100%{transform:rotate(0);}
  50%{transform:rotate(5deg);}
}

h1{
  margin:5px 0;
  color:#ff5f9e;
}

p{
  min-height:70px;
  font-size:15px;
  color:#444;
}

button{
  margin-top:15px;
  padding:10px 22px;
  border:none;
  border-radius:20px;
  background:#ff7eb3;
  color:white;
  cursor:pointer;
}
button:hover{
  background:#ff4f95;
}

.footer{
  font-size:11px;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- sparkles -->
<div class="sparkle" style="left:15%;animation-delay:0s"></div>
<div class="sparkle" style="left:35%;animation-delay:2s"></div>
<div class="sparkle" style="left:55%;animation-delay:4s"></div>
<div class="sparkle" style="left:75%;animation-delay:1s"></div>

<div class="card">
  <div class="kitty">🐱🎀</div>

  <img src="hanin.jpg" class="photo" alt="Hanin">

  <h1>Hai Hanin</h1>

  <p id="text">Klik aja, isinya random kok.</p>

  <button onclick="randomText()">klik lagi</button>

  <div class="footer">
    cuma web lucu, nggak ada maksud apa-apa
  </div>
</div>

<script>
const texts=[
  "Hari ini keliatan capek tapi masih kelihatan oke.",
  "Ini random aja, jangan ditarik ke mana-mana.",
  "Kalau lagi males, ya gapapa sih.",
  "Web iseng doang, bukan kode rahasia.",
  "Kadang hal lucu bikin hari agak mendingan.",
  "Nggak harus dibales juga kok."
];

function randomText(){
  document.getElementById("text").innerText=
    texts[Math.floor(Math.random()*texts.length)];
}
</script>

</body>
</html>
