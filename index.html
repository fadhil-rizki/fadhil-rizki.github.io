<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Open This 🎁</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffd6e8, #ffeaf3);
  font-family: Arial, sans-serif;
}
.box {
  background: white;
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: pop 1s ease;
}
@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: #ff7aa2;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #ff5f90;
}
</style>
</head>
<body>

<div class="box">
  <h2>🎂 Ada sesuatu buat kamu</h2>
  <p>Klik tombol di bawah ya</p>
  <button onclick="location.href='page1.html'">Buka 🎉</button>
</div>

</body>
</html>
